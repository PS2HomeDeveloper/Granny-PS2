name: Build Granny PS2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME_NAME: "Granny"
  GAME_VERSION: "1.0.0"
  BUILD_TYPE: "USB"
  VIDEO_MODE: "NTSC"

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            autoconf \
            automake \
            libtool \
            patch \
            git \
            texinfo \
            flex \
            bison \
            gettext \
            autopoint \
            libgsl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            wget \
            curl \
            python3 \
            pkg-config \
            gh \
            7zip

          command -v gcc
          command -v g++
          command -v make
          command -v cmake
          command -v git
          command -v gh
          command -v 7z

      - name: Build PS2DEV From Source
        shell: bash
        run: |
          set -euo pipefail

          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          sudo mkdir -p "$PS2DEV"
          sudo chown -R "$USER:$USER" "$PS2DEV"

          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin

          git clone --depth 1 \
            https://github.com/ps2dev/ps2dev.git \
            "$RUNNER_TEMP/ps2dev-source"

          cd "$RUNNER_TEMP/ps2dev-source"

          ./build-all.sh

          command -v mips64r5900el-ps2-elf-gcc
          command -v bin2c

          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"

          test -f "$GSKIT/include/gsKit.h"
          test -f "$GSKIT/lib/libgskit.a"
          test -f "$GSKIT/lib/libdmakit.a"
          test -f "$GSKIT/lib/libgskit_toolkit.a"

          echo "PS2DEV installation verified successfully."

          {
            echo "PS2DEV=$PS2DEV"
            echo "PS2SDK=$PS2SDK"
            echo "GSKIT=$GSKIT"
          } >> "$GITHUB_ENV"

          {
            echo "$PS2DEV/bin"
            echo "$PS2DEV/ee/bin"
            echo "$PS2DEV/iop/bin"
            echo "$PS2DEV/dvp/bin"
            echo "$PS2SDK/bin"
          } >> "$GITHUB_PATH"

      - name: Checkout Granny Source
        uses: actions/checkout@v4
        with:
          repository: PS2HomeDeveloper/Granny-PS2
          ref: main
          path: Granny-PS2

      - name: Build Game
        shell: bash
        working-directory: Granny-PS2
        run: |
          set -euo pipefail

          echo "Building Granny..."

          make

          test -s build/output/usb/Granny.elf

          echo "Granny ELF built successfully."

      - name: Create 7z Package
        shell: bash
        working-directory: Granny-PS2
        run: |
          set -euo pipefail

          PACKAGE_NAME="${GAME_NAME}-v${GAME_VERSION}-${BUILD_TYPE}-${VIDEO_MODE}.7z"

          PACKAGE_DIR="$GITHUB_WORKSPACE/Granny-PS2/build/packages"
          PACKAGE_PATH="$PACKAGE_DIR/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"

          rm -f "$PACKAGE_PATH"

          cd build/output/usb

          7z a -t7z -mx=9 "$PACKAGE_PATH" Granny.elf

          7z t "$PACKAGE_PATH"

          test -s "$PACKAGE_PATH"

          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"

          echo "Package created successfully: $PACKAGE_NAME"

      - name: Upload to Latest Release
        shell: bash
        working-directory: Granny-PS2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')

          if [ -z "$TAG" ]; then
            echo "ERROR: No published release was found."
            exit 1
          fi

          echo "Target release: $TAG"

          gh release upload "$TAG" "$PACKAGE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "================================"
          echo "Granny build completed."
          echo "Release: $TAG"
          echo "Package: $(basename "$PACKAGE_PATH")"
          echo "================================"
