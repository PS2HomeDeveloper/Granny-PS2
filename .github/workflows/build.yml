name: Build Granny PS2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME_NAME: "Granny"
  GAME_VERSION: "1.0.0"
  BUILD_TYPE: "USB"
  VIDEO_MODE: "NTSC"

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            autoconf \
            automake \
            libtool \
            patch \
            git \
            texinfo \
            flex \
            bison \
            gettext \
            autopoint \
            libgsl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            wget \
            curl \
            python3 \
            7zip

          command -v gh
          command -v 7z

      - name: Build PS2DEV From Source
        shell: bash
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin

          sudo mkdir -p "$PS2DEV"
          sudo chown -R "$USER:$USER" "$PS2DEV"

          git clone --depth 1 \
            https://github.com/ps2dev/ps2dev.git \
            "$RUNNER_TEMP/ps2dev-source"

          cd "$RUNNER_TEMP/ps2dev-source"

          if ./build-all.sh; then
            echo "PS2DEV build completed."
          else
            echo "::warning::build-all.sh returned a non-zero exit code. Checking required components."
          fi

          command -v mips64r5900el-ps2-elf-gcc

          test -d "$PS2SDK/ee/include"
          test -d "$PS2SDK/ee/lib"
          test -d "$GSKIT/include"

          echo "PS2DEV installation verified."

          echo "PS2DEV=$PS2DEV" >> "$GITHUB_ENV"
          echo "PS2SDK=$PS2SDK" >> "$GITHUB_ENV"
          echo "GSKIT=$GSKIT" >> "$GITHUB_ENV"

          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/iop/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/dvp/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"

      - name: Checkout Granny Source
        uses: actions/checkout@v4
        with:
          repository: PS2HomeDeveloper/Granny-PS2
          path: Granny-PS2

      - name: Build Game
        working-directory: Granny-PS2
        run: |
          make

          test -s build/output/usb/Granny.elf

          echo "Granny ELF built successfully."

      - name: Create 7z Package
        working-directory: Granny-PS2
        run: |
          PACKAGE="${GAME_NAME}-v${GAME_VERSION}-${BUILD_TYPE}-${VIDEO_MODE}.7z"

          mkdir -p build/packages

          7z a -t7z -mx=9 \
            "build/packages/$PACKAGE" \
            "build/output/usb/Granny.elf"

          test -s "build/packages/$PACKAGE"

          echo "PACKAGE_PATH=build/packages/$PACKAGE" >> "$GITHUB_ENV"

          echo "Package created: $PACKAGE"

      - name: Upload to Latest Release
        working-directory: Granny-PS2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api \
            repos/PS2HomeDeveloper/Granny-PS2/releases/latest \
            --jq '.tag_name')

          if [ -z "$TAG" ]; then
            echo "No latest release found."
            exit 1
          fi

          gh release upload "$TAG" "$PACKAGE_PATH" \
            --repo PS2HomeDeveloper/Granny-PS2 \
            --clobber

          echo "Uploaded successfully to release: $TAG"
