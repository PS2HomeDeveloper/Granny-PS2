name: Build Granny PS2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME_VERSION: "1.0.0"
  GAME_NAME: "Granny"
  BUILD_TYPE: "USB"
  VIDEO_MODE: "NTSC"

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            autoconf \
            automake \
            libtool \
            patch \
            git \
            texinfo \
            flex \
            bison \
            gettext \
            autopoint \
            libgsl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            wget \
            curl \
            python3 \
            7zip

      - name: Build PS2DEV From Source
        run: |
          export PS2DEV="$RUNNER_TEMP/ps2dev"
          export PS2SDK="$PS2DEV/ps2sdk"
          export GSKIT="$PS2DEV/gsKit"

          mkdir -p "$PS2DEV"

          git clone https://github.com/ps2dev/ps2dev.git

          cd ps2dev
          ./build-all.sh

          echo "PS2DEV=$PS2DEV" >> "$GITHUB_ENV"
          echo "PS2SDK=$PS2SDK" >> "$GITHUB_ENV"
          echo "GSKIT=$GSKIT" >> "$GITHUB_ENV"

          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/iop/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/dvp/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"

      - name: Checkout Granny Source
        uses: actions/checkout@v4
        with:
          repository: PS2HomeDeveloper/Granny-PS2
          path: Granny-PS2

      - name: Build Game
        working-directory: Granny-PS2
        run: |
          make

          test -f build/output/usb/Granny.elf

      - name: Create 7z Package
        working-directory: Granny-PS2
        run: |
          PACKAGE="${GAME_NAME}-v${GAME_VERSION}-${BUILD_TYPE}-${VIDEO_MODE}.7z"

          mkdir -p build/packages

          7zz a -t7z -mx=9 \
            "build/packages/$PACKAGE" \
            "build/output/usb/Granny.elf"

          echo "PACKAGE_PATH=build/packages/$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload to Latest Release
        working-directory: Granny-PS2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list \
            --repo PS2HomeDeveloper/Granny-PS2 \
            --limit 20 \
            --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName' | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No latest release found."
            exit 1
          fi

          gh release upload "$TAG" "$PACKAGE_PATH" \
            --repo PS2HomeDeveloper/Granny-PS2 \
            --clobber

          echo "Uploaded $PACKAGE_PATH to release $TAG"
